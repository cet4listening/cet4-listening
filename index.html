<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四级听力真题 · 近三年汇总</title>
<meta name="description" content="近三年大学英语四级听力真题汇总：按年份、套数选择，在线播放听力音频，展开查看题目选项与答案。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233f63f6'/%3E%3Cpath d='M6 17a10 10 0 0 1 20 0' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Crect x='6' y='17' width='5' height='8' rx='2.2' fill='white'/%3E%3Crect x='21' y='17' width='5' height='8' rx='2.2' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 13a8 8 0 0 1 16 0"/>
          <path d="M4 13v3a2 2 0 0 0 2 2h1v-7H6a2 2 0 0 0-2 2z"/>
          <path d="M20 13v3a2 2 0 0 1-2 2h-1v-7h1a2 2 0 0 1 2 2z"/>
          <path d="M17 18v.5a2.5 2.5 0 0 1-2.5 2.5H12"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>四级听力真题</h1>
        <p id="brandSub">近三年真题 · 分套播放 · 题目与答案</p>
      </div>
    </div>

    <nav class="tabs" role="tablist" aria-label="页面视图">
      <button class="tab is-active" id="tabPractice" role="tab" aria-selected="true" aria-controls="viewPractice">听力练习</button>
      <button class="tab" id="tabAnswers" role="tab" aria-selected="false" aria-controls="viewAnswers">答案速查</button>
    </nav>
  </div>
</header>

<main class="page">

  <!-- ============ 听力练习 ============ -->
  <section class="view" id="viewPractice" role="tabpanel" aria-labelledby="tabPractice">
    <div class="intro">
      <div class="intro-text">
        <h2>选一套，边听边做</h2>
        <p>点击某一套展开题干与选项，点「播放」即可听这一套的完整听力。选项点一下即记录作答，点「显示答案」对照。</p>
      </div>
      <div class="intro-stats" id="introStats"></div>
    </div>

    <div class="filters" id="yearFilters" aria-label="按年份筛选"></div>

    <div id="examList" class="exam-list"></div>

    <p class="empty" id="emptyHint" hidden>这一年份暂时没有数据。</p>
  </section>

  <!-- ============ 答案速查 ============ -->
  <section class="view" id="viewAnswers" role="tabpanel" aria-labelledby="tabAnswers" hidden>
    <div class="intro">
      <div class="intro-text">
        <h2>答案速查</h2>
        <p>按年份、套数收起展开，25 题答案一屏看完。你做过题的地方会同时显示对错与正确率。</p>
      </div>
      <div class="intro-stats">
        <button class="ghost-btn" id="clearAllAnswers" type="button">清除全部作答记录</button>
      </div>
    </div>
    <div id="answerList" class="answer-list"></div>
  </section>

</main>

<footer class="footer">
  <p>题目与音频来自公开的在线真题页面，仅供个人学习使用；如遇音频无法播放，请检查网络或稍后重试。</p>
  <p id="sourceLine"></p>
</footer>

<!-- ============ 底部播放器 ============ -->
<div class="player" id="player" hidden>
  <div class="player-inner">
    <div class="p-left">
      <button class="p-icon p-skip-btn" id="pBack" type="button" aria-label="后退 15 秒" title="后退 15 秒">-15</button>
      <button class="p-play" id="pPlay" type="button" aria-label="播放">
        <svg class="ic-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.87l10-6.5a1 1 0 0 0 0-1.74l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>
        <svg class="ic-pause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" hidden><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
        <span class="p-spinner" aria-hidden="true"></span>
      </button>
      <button class="p-icon p-skip-btn" id="pForward" type="button" aria-label="前进 15 秒" title="前进 15 秒">+15</button>
    </div>

    <div class="p-mid">
      <div class="p-titles">
        <span class="p-title" id="pTitle">未选择音频</span>
        <span class="p-sub" id="pSub"></span>
      </div>
      <div class="p-bar" id="pBar" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="p-track"><div class="p-fill" id="pFill"></div></div>
        <div class="p-knob" id="pKnob"></div>
      </div>
      <div class="p-times"><span id="pCur">0:00</span><span id="pDur">0:00</span></div>
    </div>

    <div class="p-right">
      <label class="p-speed">
        <select id="pSpeed" aria-label="播放速度">
          <option value="0.75">0.75×</option>
          <option value="1" selected>1.0×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2.0×</option>
        </select>
      </label>
      <button class="p-icon p-close" id="pClose" type="button" aria-label="关闭播放器" title="关闭播放器">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <audio id="audio" preload="metadata"></audio>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
